name: CI - Build, Push and Deploy

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: receipt-scanner

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image for pull request
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: receipt-scanner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image for branch push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Windows self-hosted runner
    if: github.event_name == 'push' && needs.docker.result == 'success'
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out source for monitoring tools
        uses: actions/checkout@v4
      - name: Start independent endpoint monitor
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          MONITOR_LOG: ${{ github.workspace }}\deploy-monitor.jsonl
          VERSION: ${{ github.sha }}
        run: |
          Remove-Item -LiteralPath $env:MONITOR_LOG -Force -ErrorAction SilentlyContinue
          $args = @('-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\tools\monitor_endpoint.ps1",'-Url','http://127.0.0.1:8000/','-Log',$env:MONITOR_LOG,'-Seconds','90','-Version',$env:VERSION)
          Start-Process powershell.exe -ArgumentList $args -WindowStyle Hidden
          Start-Sleep -Seconds 2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull latest image, replace, and health-check container
        # Bypass is scoped to this GitHub Actions process only; the machine's
        # execution policy is not changed.
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER_NAME: receipt-scanner
          HOST_PORT: "8000"
        run: |
          $ErrorActionPreference = 'Stop'
          $oldImage = ''
          $oldContainer = docker ps -aq --filter "name=^$env:CONTAINER_NAME$"
          if ($oldContainer) {
            $oldImage = docker inspect --format '{{.Config.Image}}' $env:CONTAINER_NAME
          }

          docker pull $env:IMAGE

          if ($oldContainer) {
            docker stop $env:CONTAINER_NAME
            docker rm $env:CONTAINER_NAME
          }

          try {
            docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $env:IMAGE
            $healthy = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$env:HOST_PORT/" -TimeoutSec 3
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $healthy) {
              Write-Host 'New container did not become reachable. Container logs:'
              docker logs $env:CONTAINER_NAME
              throw 'Receipt Scanner health check failed.'
            }
            Write-Host "Receipt Scanner is reachable at http://127.0.0.1:$env:HOST_PORT/"
          } catch {
            Write-Host 'Deployment failed. Current container logs:'
            docker logs $env:CONTAINER_NAME 2>$null
            docker rm -f $env:CONTAINER_NAME 2>$null
            if ($oldImage) {
              Write-Host "Rolling back to $oldImage"
              docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p "${env:HOST_PORT}:8000" $oldImage
            }
            throw
          }

      - name: Wait for monitor post-deployment window
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: Start-Sleep -Seconds 95

      - name: Upload deployment monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-monitor-${{ github.run_id }}
          path: deploy-monitor.jsonl
          if-no-files-found: warn

      - name: Write deployment summary
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $rows = @()
          if (Test-Path deploy-monitor.jsonl) {
            $rows = Get-Content deploy-monitor.jsonl | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} }
          }
          $rows = @($rows | Sort-Object { [DateTime]$_.start_utc })
          $ok = @($rows | Where-Object { $_.reachable -eq $true }).Count
          $fail = @($rows | Where-Object { $_.reachable -ne $true }).Count
          $versions = @($rows | Select-Object -ExpandProperty version -Unique)
          $result = if ($rows.Count -gt 0 -and $fail -eq 0) { 'SUCCESS' } else { 'CHECK_REQUIRED' }
          $gaps = @()
          for ($i = 1; $i -lt $rows.Count; $i++) {
            $gap = (([DateTime]$rows[$i].start_utc) - ([DateTime]$rows[$i-1].end_utc)).TotalSeconds
            if ($gap -gt 2) { $gaps += [math]::Round($gap, 1) }
          }
          $maxGap = if ($gaps.Count -gt 0) { ($gaps | Measure-Object -Maximum).Maximum } else { 0 }
          $before = if ($rows.Count -gt 0) { $rows[0] } else { $null }
          $during = if ($rows.Count -gt 2) { $rows[[math]::Floor($rows.Count / 2)] } else { $before }
          $after = if ($rows.Count -gt 0) { $rows[$rows.Count - 1] } else { $null }
          $sample = { param($stage, $row) if ($null -eq $row) { "| $stage | - | - | - | - | - | - |" } else { "| $stage | $($row.start_utc) | $($row.status) | $($row.reachable) | $($row.version) | $($row.elapsed_ms) ms | $($row.error) |" } }
          @"
          # Receipt Scanner deployment verification

          **Result:** $result  |  **URL:** http://127.0.0.1:8000/  |  **Version(s):** $($versions -join ', ')

          **Requests:** $($rows.Count) total, $ok successful, $fail failed/unverified  |  **Sampling:** 1 second  |  **Maximum recorded gap:** $maxGap seconds

          ## Before / during / after

          | Stage | UTC start | HTTP | Reachable | Version | Response | Error |
          |---|---|---:|:---:|---|---:|---|
          $(& $sample 'Before' $before)
          $(& $sample 'During' $during)
          $(& $sample 'After' $after)

          ## Verification notes

          - The independent monitor started before deployment and continued after deployment.
          - Intervals over 2 seconds are marked as unverified; detected maximum gap: **$maxGap seconds**.
          - Version transition observed: **$($versions -join ' -> ')**.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
