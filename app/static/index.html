<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt Scanner</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><p class="eyebrow">RECEIPT SCANNER</p><h1>영수증을 표로 정리하세요</h1><p class="muted">구매일시를 분리하고 품목·수량·가격을 추출합니다.</p></header><section class="card"><label class="upload" for="file"><input id="file" type="file" accept="image/jpeg,image/png"><span>📷 영수증 이미지 선택</span><small>JPG, JPEG, PNG · 최대 10MB</small></label><img id="preview" class="preview" alt="미리보기"><button id="scan" disabled>OCR 시작</button><p id="status" class="status"></p></section><section id="result" class="card hidden"><div class="toolbar"><h2>인식 결과</h2><div><button id="copy" class="secondary">표 복사</button><button id="csv" class="secondary">CSV 다운로드</button></div></div><p id="date-help" class="muted"></p><table><thead><tr><th>품목</th><th>수량</th><th>가격</th><th></th></tr></thead><tbody id="rows"></tbody></table><button id="add" class="secondary">+ 행 추가</button></section><details><summary>개인정보 안내</summary><p class="muted">이미지는 OCR 처리 후 저장하지 않습니다.</p></details></main><script src="/static/app.js"></script></body></html>
